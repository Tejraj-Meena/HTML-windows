<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Editor - Trusted</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f6;--panel:#fff;--bar:#f0f1f4;--line:#dfe2e8;--text:#24272e;--muted:#7b8190;--gutter:#f7f8fa;--accent:#e2582b;--ok:#2f9e4f;--err:#d23a3a;--warn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1c1f25;--bar:#23272f;--line:#323843;--text:#e3e6ec;--muted:#8b93a3;--gutter:#20242b}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1c1f25;--bar:#23272f;--line:#323843;--text:#e3e6ec;--muted:#8b93a3;--gutter:#20242b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;flex-wrap:wrap;gap:8px}
h1{font-size:16px;font-weight:500;margin:0}
.hdr-left{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
.hdr-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.app{flex:1;min-height:0;margin:0 16px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;overflow:hidden}
.app.stack{flex-direction:column}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
#ed{flex:0 0 50%}
#pv{flex:1;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;background:var(--bar);border-bottom:1px solid var(--line);height:44px;padding:0 10px;flex:none;overflow-x:auto}
#tabs{padding:0;gap:0;overflow-x:auto;overflow-y:hidden}
.tab{border:0;background:none;color:var(--muted);font:500 12px "JetBrains Mono",monospace;padding:0 8px 0 14px;height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.tab i{width:9px;height:9px;border-radius:2px;display:block}
.tab[aria-selected="true"]{color:var(--text);background:var(--panel);border-bottom-color:var(--accent)}
.tab .x{border:0;background:none;color:var(--muted);font:14px/1 monospace;cursor:pointer;padding:4px;border-radius:4px;opacity:.6}
.tab .x:hover,.tab .x.sure{opacity:1;color:var(--err)}
.add{border:0;background:none;color:var(--muted);font:18px monospace;cursor:pointer;padding:0 12px;height:44px;flex:none}
.name{font:12px "JetBrains Mono",monospace;width:120px;padding:5px 7px;border:1px solid var(--accent);border-radius:5px;background:var(--panel);color:var(--text);outline:0;flex:none}
:focus-visible{outline:2px solid #3b82f6;outline-offset:-2px}
.sp{flex:1}
.btn,select{font:12px "JetBrains Mono",monospace;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover,select:hover{border-color:var(--muted)}
.btn.sure{border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.live{font:11px "JetBrains Mono",monospace;color:var(--muted);display:flex;align-items:center;gap:7px;margin:0 4px}
.live b{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.err b{background:var(--err)}
.code{flex:1;min-height:0;display:flex}
.gut{width:46px;flex:none;background:var(--gutter);border-right:1px solid var(--line);overflow:hidden;color:var(--muted);font:13px/20px "JetBrains Mono",monospace;text-align:right;padding:8px 8px 8px 0;white-space:pre;user-select:none}
textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:var(--panel);color:var(--text);font:13px/20px "JetBrains Mono",monospace;padding:8px 12px;tab-size:2;white-space:pre;overflow:auto}
#div{flex:none;width:6px;background:var(--line);cursor:col-resize;touch-action:none}
.app.stack #div{width:auto;height:6px;cursor:row-resize}
#preview-container{flex:1;min-height:0;display:flex;flex-direction:column}
.frame{flex:1;min-height:0;background:#fff}
iframe{border:0;width:100%;height:100%;background:#fff;display:block}
#con{flex:none;height:130px;border-top:1px solid var(--line);display:flex;flex-direction:column}
#con.off{display:none}
#con-divider{width:100%;height:6px;background:var(--line);cursor:row-resize;touch-action:none;flex:none}
#log{flex:1;min-height:0;overflow:auto;font:12px/1.5 "JetBrains Mono",monospace;padding:6px 12px}
#log div{border-bottom:1px solid var(--line);padding:2px 0;white-space:pre-wrap;word-break:break-word}
.e{color:var(--err)}.w{color:var(--warn)}.i{color:var(--ok)}
.cbar{display:flex;justify-content:space-between;padding:4px 10px;background:var(--bar);font:11px "JetBrains Mono",monospace;color:var(--muted);flex:none}
.cbar button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:999}
#toast.show{opacity:1}
input[type="file"]{display:none}
@media (max-width:760px){.app{flex-direction:column}#div{width:auto;height:6px;cursor:row-resize}.hide-m{display:none}header{flex-direction:column;align-items:flex-start}.hdr-right{width:100%}}
</style>
</head>
<body>
<header>
  <div class="hdr-left"><h1>Code Editor ✓</h1></div>
  <div class="hdr-right">
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="btn" id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
    <button class="btn" id="imphtml" title="Select multiple HTML files">📄 HTML</button>
    <button class="btn" id="impcss" title="Select multiple CSS files">🎨 CSS</button>
    <button class="btn" id="impjs" title="Select multiple JS files">⚙️ JS</button>
    <button class="btn" id="impimg" title="Select multiple images">🖼️ Images</button>
    <button class="btn" id="theme">🌙 Theme</button>
  </div>
</header>
<main class="app" id="app">
  <section class="pane" id="ed">
    <div class="bar" id="tabs" role="tablist"></div>
    <div class="code"><div class="gut" id="gut">1</div><textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code"></textarea></div>
  </section>
  <div id="div" role="separator" tabindex="0"></div>
  <section class="pane" id="pv">
    <div id="preview-container">
      <div class="bar">
        <span class="live" id="live"><span>LIVE</span><b></b></span>
        <select id="page" aria-label="Preview page"></select>
        <span class="sp"></span>
        <button class="btn hide-m" id="lay">Stack</button>
        <button class="btn" id="cons">Console</button>
        <button class="btn" id="dl">Download</button>
        <button class="btn" id="rst">Reset</button>
      </div>
      <div class="frame"><iframe id="out" title="Preview" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-top-navigation-by-user-activation"></iframe></div>
    </div>
    <div id="con">
      <div id="con-divider" role="separator"></div>
      <div class="cbar"><span>Console</span><button id="clr">Clear</button></div>
      <div id="log"></div>
    </div>
  </section>
</main>
<div id="toast" role="status"></div>
<input type="file" id="fileinput" accept=".html,.htm" multiple>
<input type="file" id="fileinput2" accept=".css" multiple>
<input type="file" id="fileinput3" accept=".js" multiple>
<input type="file" id="fileinput4" accept="image/*" multiple>

<script>
(function(){
'use strict';

// ====== CONSTANTS ======
const SC = '<\/script>';
const KEY = 'code-editor:v4';
const VOID_TAGS = /^(area|base|br|col|embed|hr|img|input|link|meta|source|track|wbr)$/i;
const PAIRS = {'(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`'};

// ====== STATE ======
let files = starter();
let cur = 'index.html';
let page = 'index.html';
let images = {};
let undo = [];
let redo = [];
let editting = false;

// ====== DOM REFERENCES ======
const src = document.getElementById('src');
const gut = document.getElementById('gut');
const out = document.getElementById('out');
const live = document.getElementById('live');
const log = document.getElementById('log');
const tabs = document.getElementById('tabs');
const root = document.documentElement;

// ====== HELPER FUNCTIONS ======
function $(id) { return document.getElementById(id); }

function starter() {
  return [
    {name:'index.html',content:'<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>Home</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <nav><a href="index.html">Home</a> <a href="about.html">About</a></nav>\n  <h1>Home page</h1>\n  <p>Test your code here. Create multiple pages and navigate between them.</p>\n  <button id="btn">Click me</button>\n  <p id="count">Clicks: 0</p>\n  <script src="script.js">'+SC+'\n</body>\n</html>'},
    {name:'about.html',content:'<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>About</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <nav><a href="index.html">Home</a> <a href="about.html">About</a></nav>\n  <h1>About page</h1>\n  <p>This page shares style.css with the home page.</p>\n</body>\n</html>'},
    {name:'style.css',content:'body {\n  font-family: system-ui, sans-serif;\n  max-width: 480px;\n  margin: 40px auto;\n  padding: 0 16px;\n}\nnav a {\n  margin-right: 12px;\n}\nbutton {\n  padding: 8px 16px;\n  font-size: 16px;\n  cursor: pointer;\n}'},
    {name:'script.js',content:'let n = 0;\nconst count = document.getElementById("count");\nconst btn = document.getElementById("btn");\n\nif (btn) {\n  btn.addEventListener("click", () => {\n    n++;\n    if (count) {\n      count.textContent = "Clicks: " + n;\n    }\n    console.log("Clicked", n, "times");\n  });\n}'}
  ];
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({files, cur, page, images}));
  } catch (e) {
    console.error('Storage error:', e);
  }
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

function get(name) {
  for (let f of files) {
    if (f.name === name) return f;
  }
  return null;
}

function ext(name) {
  const m = name.match(/\.([^.]+)$/);
  return m ? m[1].toLowerCase() : '';
}

const COL = {html: '#e2582b', css: '#2468d8', js: '#b9650f'};

function lines() {
  const n = src.value.split('\n').length;
  const a = [];
  for (let i = 1; i <= n; i++) a.push(i);
  gut.textContent = a.join('\n');
}

function htmls() {
  return files.filter(f => ext(f.name) === 'html');
}

// ====== FILE MANAGEMENT ======
function renderTabs() {
  tabs.innerHTML = '';
  
  files.forEach(f => {
    const b = document.createElement('div');
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.tabIndex = 0;
    b.setAttribute('aria-selected', f.name === cur ? 'true' : 'false');
    
    const d = document.createElement('i');
    d.style.background = COL[ext(f.name)] || '#8b93a3';
    
    const l = document.createElement('span');
    l.textContent = f.name;
    
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = 'Delete ' + f.name;
    
    b.append(d, l, x);
    
    b.onclick = () => open(f.name);
    b.onkeydown = (e) => {
      if (e.key === 'Enter' && e.target === b) open(f.name);
    };
    
    b.ondblclick = () => {
      askName(f.name, b, (n) => rename(f.name, n));
    };
    
    x.onclick = (e) => {
      e.stopPropagation();
      if (!x.classList.contains('sure')) {
        x.classList.add('sure');
        x.textContent = 'delete?';
        setTimeout(() => {
          x.classList.remove('sure');
          x.textContent = '×';
        }, 3000);
        return;
      }
      
      if (files.length < 2) {
        toast('Keep at least one file');
        return;
      }
      
      files = files.filter(g => g !== f);
      if (cur === f.name) cur = files[0].name;
      fixPage();
      save();
      open(cur);
      run();
    };
    
    tabs.appendChild(b);
  });
  
  const a = document.createElement('button');
  a.className = 'add';
  a.textContent = '+';
  a.title = 'New file';
  a.onclick = () => {
    askName('', a, (n) => {
      if (!ext(n)) n += '.html';
      if (get(n)) {
        toast(n + ' already exists');
        return;
      }
      
      const tpl = ext(n) === 'html' 
        ? '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>' + n.replace(/\.html$/, '') + '</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>' + n + '</h1>\n</body>\n</html>'
        : '';
      
      files.push({name: n, content: tpl});
      cur = n;
      fixPage();
      save();
      open(cur);
      run();
    });
  };
  tabs.appendChild(a);
  
  const pg = $('page');
  pg.innerHTML = '';
  htmls().forEach(f => {
    const o = document.createElement('option');
    o.value = o.textContent = f.name;
    pg.appendChild(o);
  });
  pg.value = page;
}

function askName(init, el, cb) {
  const i = document.createElement('input');
  i.className = 'name';
  i.value = init;
  i.placeholder = 'page.html';
  el.replaceWith(i);
  i.focus();
  i.select();
  
  let done = false;
  const fin = (ok) => {
    if (done) return;
    done = true;
    const v = i.value.trim().replace(/[\\\/]/g, '');
    if (ok && v && v !== init) {
      cb(v);
    } else {
      renderTabs();
    }
  };
  
  i.onkeydown = (e) => {
    if (e.key === 'Enter') fin(true);
    if (e.key === 'Escape') fin(false);
  };
  i.onblur = () => fin(true);
}

function rename(a, b) {
  if (get(b)) {
    toast(b + ' already exists');
    renderTabs();
    return;
  }
  
  if (!ext(b)) b += '.' + ext(a);
  
  const f = get(a);
  if (f) {
    f.name = b;
    if (cur === a) cur = b;
    if (page === a) page = b;
    fixPage();
    save();
    open(cur);
    run();
  }
}

function fixPage() {
  const h = htmls();
  if (!get(page) || ext(page) !== 'html') {
    page = (get('index.html') && 'index.html') || (h[0] && h[0].name) || '';
  }
}

function open(n) {
  cur = n;
  const f = get(n);
  if (f) {
    src.value = f.content;
    lines();
  }
  gut.scrollTop = 0;
  renderTabs();
  save();
  undo = [];
  redo = [];
  updateHistBtns();
}

function pushHist() {
  const f = get(cur);
  if (f) {
    undo.push(f.content);
    redo = [];
    updateHistBtns();
  }
}

function updateHistBtns() {
  $('undo').disabled = undo.length === 0;
  $('redo').disabled = redo.length === 0;
}

// ====== PREVIEW & BUILD ======
const HOOK = '<scr'+'ipt>(function(){function s(t,a){try{parent.postMessage({__ce:1,t:t,m:Array.prototype.map.call(a,function(x){if(typeof x==="object"){try{return JSON.stringify(x)}catch(e){}}return String(x)}).join(" ")},"*")}catch(e){}}window.open=function(url,target){var n=url.split("/").pop();if(target==="blank"||target==="_blank"){s("nav",[n]);return{close:function(){}}}return window.open(url,target)};["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){s(k,arguments);o.apply(console,arguments)}});window.addEventListener("error",function(e){s("error",[e.message+" ("+(e.filename?"":"line "+e.lineno)+")"])});window.addEventListener("unhandledrejection",function(e){s("error",["Unhandled: "+e.reason])});document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");if(/^(#|mailto:|tel:|javascript:)/i.test(h))return;e.preventDefault();if(/^(https?:)?\\/\\//i.test(h)){window.open(h,"_blank");return}s("nav",[h])},true)})();'+SC;

function norm(h) {
  return h.split('#')[0].split('?')[0].replace(/^(\.?\/)+/, '');
}

function build(name, hook) {
  const f = get(name);
  if (!f) return '<p style="font-family:sans-serif;padding:20px;color:#999">Add an HTML file to see preview.</p>';
  
  let h = f.content;
  
  if (!/<(html|body)/i.test(h)) {
    h = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + h + '</body></html>';
  }
  
  // Load CSS files
  h = h.replace(/<link\b[^>]*>/gi, (t) => {
    const m = t.match(/href=["']([^"']+)["']/i);
    if (m && /stylesheet/i.test(t)) {
      const r = get(norm(m[1]));
      if (r) return '<style>\n' + r.content.replace(/<\/style/gi, '<\\/style') + '\n</style>';
    }
    return t;
  });
  
  // Load JS files
  h = h.replace(/<script\b([^>]*?)src=["']([^"']+)["']([^>]*)>\s*<\/script>/gi, (t, a, s, b) => {
    const r = get(norm(s));
    return r ? '<script'+a+b+'>\n' + r.content.replace(/<\/script/gi, '<\\/script') + '\n' + SC : t;
  });
  
  // Replace image sources
  Object.keys(images).forEach((k) => {
    h = h.replace(new RegExp('src=["\']?' + k + '["\']?', 'g'), 'src="' + images[k] + '"');
  });
  
  if (hook) {
    h = /<head[^>]*>/i.test(h) 
      ? h.replace(/<head[^>]*>/i, (m) => m + HOOK)
      : HOOK + h;
  }
  
  return h;
}

function run() {
  live.classList.remove('err');
  log.innerHTML = '';
  try {
    out.srcdoc = build(page, true);
  } catch (e) {
    live.classList.add('err');
    const r = document.createElement('div');
    r.className = 'e';
    r.textContent = 'Build error: ' + e.message;
    log.appendChild(r);
  }
}

let tm;
function sched() {
  clearTimeout(tm);
  tm = setTimeout(run, 350);
}

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.__ce || e.source !== out.contentWindow) return;
  
  if (d.t === 'nav') {
    const n = norm(d.m);
    if (get(n) && ext(n) === 'html') {
      page = n;
      $('page').value = n;
      save();
      run();
    } else {
      toast('Page not found: ' + d.m);
      const r = document.createElement('div');
      r.className = 'w';
      r.textContent = 'Navigation error: Page "' + d.m + '" does not exist.';
      log.appendChild(r);
    }
    return;
  }
  
  const r = document.createElement('div');
  r.textContent = d.m;
  if (d.t === 'error') {
    r.className = 'e';
    live.classList.add('err');
  } else if (d.t === 'warn') {
    r.className = 'w';
  } else if (d.t === 'log' || d.t === 'info') {
    r.className = 'i';
  }
  
  log.appendChild(r);
  log.scrollTop = log.scrollHeight;
});

// ====== TEXT EDITING ======
src.addEventListener('input', () => {
  if (!editting) {
    pushHist();
    editting = true;
  }
  const f = get(cur);
  if (f) {
    f.content = src.value;
    lines();
    save();
    sched();
  }
});

src.addEventListener('scroll', () => {
  gut.scrollTop = src.scrollTop;
});

src.addEventListener('keydown', (e) => {
  editting = false;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  
  const a = src.selectionStart;
  const b = src.selectionEnd;
  const v = src.value;
  const k = e.key;
  const nx = v.charAt(b);
  const pv = v.charAt(a - 1);
  const isH = ext(cur) === 'html';
  
  // Tab to indent
  if (k === 'Tab') {
    e.preventDefault();
    src.setRangeText('  ', a, b, 'end');
    src.dispatchEvent(new Event('input'));
    return;
  }
  
  // Smart Enter
  if (k === 'Enter') {
    const ls = v.lastIndexOf('\n', a - 1) + 1;
    const ind = v.slice(ls, a).match(/^\s*/)[0];
    const before = v.slice(ls, a);
    e.preventDefault();
    
    if ((/[{(\[]/.test(pv) && /[})\]]/.test(nx)) || 
        (isH && pv === '>' && v.slice(b, b + 2) === '</')) {
      src.setRangeText('\n' + ind + '  \n' + ind, a, b, 'end');
    } else {
      src.setRangeText('\n' + ind + (/[{(\[]\s*$/.test(before) ? '  ' : ''), a, b, 'end');
    }
    src.dispatchEvent(new Event('input'));
    return;
  }
  
  // Backspace smart delete
  if (k === 'Backspace' && a === b) {
    if (PAIRS[pv] && PAIRS[pv] === nx) {
      e.preventDefault();
      src.setRangeText('', a - 1, a + 1, 'end');
      src.dispatchEvent(new Event('input'));
      return;
    }
  }
  
  // Close brackets
  if (a === b && k.length === 1 && ')]}"\'`'.indexOf(k) > -1 && nx === k) {
    e.preventDefault();
    src.selectionStart = src.selectionEnd = a + 1;
    return;
  }
  
  // Auto pair
  if (PAIRS[k]) {
    if (k === "'" && /\w/.test(pv)) return;
    
    if (a !== b) {
      e.preventDefault();
      const sel = v.slice(a, b);
      src.setRangeText(k + sel + PAIRS[k], a, b, 'select');
      src.selectionStart = a + 1;
      src.selectionEnd = b + 1;
      src.dispatchEvent(new Event('input'));
      return;
    }
    
    if (nx && !/[\s)\]}>,;]/.test(nx)) return;
    e.preventDefault();
    src.setRangeText(k + PAIRS[k], a, b, 'end');
    src.selectionStart = src.selectionEnd = a + 1;
    src.dispatchEvent(new Event('input'));
    return;
  }
  
  // Auto close HTML tags
  if (k === '>' && isH && a === b) {
    const lt = v.lastIndexOf('<', a - 1);
    const seg = v.slice(lt, a);
    const m = lt > -1 && seg.match(/^<([a-zA-Z][\w:-]*)(\s[^<>]*)?$/);
    
    if (m && !/\/$/.test(seg) && !VOID_TAGS.test(m[1])) {
      e.preventDefault();
      src.setRangeText('></' + m[1] + '>', a, b, 'end');
      src.selectionStart = src.selectionEnd = a + 1;
    }
  }
});

document.addEventListener('keydown', (e) => {
  const m = e.ctrlKey || e.metaKey;
  if (m && e.key.toLowerCase() === 's') {
    e.preventDefault();
    download();
  }
  if (m && e.key === 'Enter') {
    e.preventDefault();
    run();
  }
  if (m && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    doUndo();
  }
  if ((m && e.key === 'y') || (m && e.shiftKey && e.key === 'Z')) {
    e.preventDefault();
    doRedo();
  }
});

// ====== UNDO/REDO ======
function doUndo() {
  if (undo.length > 0) {
    const f = get(cur);
    if (f) {
      redo.push(f.content);
      f.content = undo.pop();
      src.value = f.content;
      lines();
      save();
      run();
      updateHistBtns();
    }
  }
}

function doRedo() {
  if (redo.length > 0) {
    const f = get(cur);
    if (f) {
      undo.push(f.content);
      f.content = redo.pop();
      src.value = f.content;
      lines();
      save();
      run();
      updateHistBtns();
    }
  }
}

$('undo').onclick = doUndo;
$('redo').onclick = doRedo;

// ====== FILE IMPORT ======
function loadFiles(fi, type) {
  fi.onchange = (e) => {
    const files_arr = Array.from(e.target.files);
    if (files_arr.length === 0) return;
    
    let loaded = 0;
    const total = files_arr.length;
    
    files_arr.forEach((file) => {
      const r = new FileReader();
      r.onload = (ev) => {
        const nm = file.name;
        
        if (type === 'img') {
          images[nm] = ev.target.result;
          loaded++;
        } else {
          if (get(nm)) {
            toast(nm + ' skipped (already exists)');
            loaded++;
            return;
          }
          files.push({name: nm, content: ev.target.result});
          loaded++;
        }
        
        if (loaded === total) {
          if (type === 'img') {
            toast('✓ Added ' + total + ' image(s)');
          } else {
            cur = files_arr[files_arr.length - 1].name;
            fixPage();
            save();
            open(cur);
            run();
            toast('✓ Added ' + total + ' file(s)');
          }
          save();
        }
      };
      
      r.onerror = () => {
        toast('Error loading ' + file.name);
        loaded++;
      };
      
      if (type === 'img') {
        r.readAsDataURL(file);
      } else {
        r.readAsText(file);
      }
    });
    
    fi.value = '';
  };
  fi.click();
}

loadFiles($('fileinput'), 'html');
loadFiles($('fileinput2'), 'css');
loadFiles($('fileinput3'), 'js');
$('impimg').onclick = () => loadFiles($('fileinput4'), 'img');
$('imphtml').onclick = () => $('fileinput').click();
$('impcss').onclick = () => $('fileinput2').click();
$('impjs').onclick = () => $('fileinput3').click();

// ====== DOWNLOAD ======
function zip(list) {
  const enc = new TextEncoder();
  const parts = [];
  const cd = [];
  let off = 0;
  
  const CT = (function() {
    const t = [];
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  
  function crc(b) {
    let c = ~0;
    for (let i = 0; i < b.length; i++) c = CT[(c ^ b[i]) & 255] ^ (c >>> 8);
    return (~c) >>> 0;
  }
  
  list.forEach((f) => {
    const nm = enc.encode(f.name);
    const d = enc.encode(f.content);
    const c = crc(d);
    
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true);
    h.setUint16(4, 20, true);
    h.setUint16(6, 0x0800, true);
    h.setUint32(14, c, true);
    h.setUint32(18, d.length, true);
    h.setUint32(22, d.length, true);
    h.setUint16(26, nm.length, true);
    
    parts.push(h.buffer, nm, d);
    
    const g = new DataView(new ArrayBuffer(46));
    g.setUint32(0, 0x02014b50, true);
    g.setUint16(4, 20, true);
    g.setUint16(6, 20, true);
    g.setUint16(8, 0x0800, true);
    g.setUint32(16, c, true);
    g.setUint32(20, d.length, true);
    g.setUint32(24, d.length, true);
    g.setUint16(28, nm.length, true);
    g.setUint32(42, off, true);
    
    cd.push(g.buffer, nm);
    off += 30 + nm.length + d.length;
  });
  
  let size = 0;
  cd.forEach((x) => { size += x.byteLength || x.length; });
  
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, list.length, true);
  e.setUint16(10, list.length, true);
  e.setUint32(12, size, true);
  e.setUint32(16, off, true);
  
  return new Blob(parts.concat(cd, [e.buffer]), {type: 'application/zip'});
}

async function download() {
  try {
    const blob = zip(files);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'website.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('✓ Download started');
  } catch (e) {
    toast('Error: ' + e.message);
    live.classList.add('err');
    const r = document.createElement('div');
    r.className = 'e';
    r.textContent = 'Download failed: ' + e.message;
    log.appendChild(r);
  }
}

$('dl').onclick = download;

// ====== RESET ======
const rb = $('rst');
rb.onclick = function() {
  if (!rb.classList.contains('sure')) {
    rb.classList.add('sure');
    rb.textContent = 'Sure?';
    setTimeout(() => {
      rb.classList.remove('sure');
      rb.textContent = 'Reset';
    }, 3000);
    return;
  }
  rb.classList.remove('sure');
  rb.textContent = 'Reset';
  files = starter();
  cur = page = 'index.html';
  images = {};
  save();
  open(cur);
  run();
  undo = [];
  redo = [];
  updateHistBtns();
  toast('✓ Reset to starter project');
};

// ====== UI CONTROLS ======
$('cons').onclick = () => $('con').classList.toggle('off');
$('clr').onclick = () => { log.innerHTML = ''; };
$('lay').onclick = () => {
  const s = $('app').classList.toggle('stack');
  $('lay').textContent = s ? 'Side by side' : 'Stack';
  $('ed').style.flex = '0 0 50%';
};
$('theme').onclick = () => {
  const dk = getComputedStyle(root).getPropertyValue('--bg').trim() === '#15171b';
  const n = dk ? 'light' : 'dark';
  root.setAttribute('data-theme', n);
  try { localStorage.setItem('code-editor:v1:theme', n); } catch (e) {}
};

// ====== RESIZABLE PANES ======
const dv = $('div');
let drag = false;
dv.addEventListener('pointerdown', (e) => {
  drag = true;
  dv.setPointerCapture(e.pointerId);
  out.style.pointerEvents = 'none';
});
dv.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const r = $('app').getBoundingClientRect();
  const v = getComputedStyle($('app')).flexDirection === 'column';
  const p = v ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
  $('ed').style.flex = '0 0 ' + Math.max(0.15, Math.min(0.85, p)) * 100 + '%';
});
dv.addEventListener('pointerup', () => {
  drag = false;
  out.style.pointerEvents = '';
  editting = false;
});

// ====== RESIZABLE CONSOLE ======
const cdiv = $('con-divider');
let cdrag = false;
cdiv.addEventListener('pointerdown', (e) => {
  cdrag = true;
  cdiv.setPointerCapture(e.pointerId);
});
cdiv.addEventListener('pointermove', (e) => {
  if (!cdrag) return;
  const r = $('con').parentElement.getBoundingClientRect();
  const p = (r.bottom - e.clientY) / r.height;
  $('con').style.flex = '0 0 ' + Math.max(0.1, Math.min(0.8, p)) * 100 + '%';
});
cdiv.addEventListener('pointerup', () => {
  cdrag = false;
});

// ====== PAGE SELECT ======
$('page').onchange = function() {
  page = this.value;
  save();
  run();
};

// ====== LOAD FROM STORAGE ======
try {
  const s = localStorage.getItem(KEY);
  if (s) {
    const p = JSON.parse(s);
    if (p.files && p.files.length) {
      files = p.files;
      cur = p.cur;
      page = p.page;
      images = p.images || {};
    }
  }
  const t = localStorage.getItem('code-editor:v1:theme');
  if (t) root.setAttribute('data-theme', t);
} catch (e) {
  console.error('Storage load error:', e);
}

// ====== INITIALIZE ======
if (!get(cur)) cur = files[0].name;
fixPage();
open(cur);
run();
updateHistBtns();
toast('✓ Editor ready. You can trust this.');

})();
</script>
