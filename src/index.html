<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Editor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f6;--panel:#fff;--bar:#f0f1f4;--line:#dfe2e8;--text:#24272e;--muted:#7b8190;--gutter:#f7f8fa;--accent:#e2582b;--ok:#2f9e4f;--err:#d23a3a;--warn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1c1f25;--bar:#23272f;--line:#323843;--text:#e3e6ec;--muted:#8b93a3;--gutter:#20242b}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1c1f25;--bar:#23272f;--line:#323843;--text:#e3e6ec;--muted:#8b93a3;--gutter:#20242b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;flex-wrap:wrap;gap:8px}
h1{font-size:16px;font-weight:500;margin:0}
.hdr-left{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
.hdr-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#savest{font:11px "JetBrains Mono",monospace;color:var(--muted)}
#savest.unsaved{color:var(--warn)}
.app{flex:1;min-height:0;margin:0 16px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;overflow:hidden}
.app.stack{flex-direction:column}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
#ed{flex:0 0 50%}
#pv{flex:1;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;background:var(--bar);border-bottom:1px solid var(--line);height:44px;padding:0 10px;flex:none;overflow-x:auto}
#tabs{padding:0;gap:0;overflow-x:auto;overflow-y:hidden}
.tab{border:0;background:none;color:var(--muted);font:500 12px "JetBrains Mono",monospace;padding:0 8px 0 14px;height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.tab i{width:9px;height:9px;border-radius:2px;display:block}
.tab[aria-selected="true"]{color:var(--text);background:var(--panel);border-bottom-color:var(--accent)}
.tab .x{border:0;background:none;color:var(--muted);font:14px/1 monospace;cursor:pointer;padding:4px;border-radius:4px;opacity:.6}
.tab .x:hover,.tab .x.sure{opacity:1;color:var(--err)}
.add{border:0;background:none;color:var(--muted);font:18px monospace;cursor:pointer;padding:0 12px;height:44px;flex:none}
.name{font:12px "JetBrains Mono",monospace;width:120px;padding:5px 7px;border:1px solid var(--accent);border-radius:5px;background:var(--panel);color:var(--text);outline:0;flex:none}
:focus-visible{outline:2px solid #3b82f6;outline-offset:-2px}
.sp{flex:1}
.btn,select{font:12px "JetBrains Mono",monospace;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover,select:hover{border-color:var(--muted)}
.btn.sure{border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary.dirty{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.live{font:11px "JetBrains Mono",monospace;color:var(--muted);display:flex;align-items:center;gap:7px;margin:0 4px}
.live b{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.err b{background:var(--err)}
.code{flex:1;min-height:0;display:flex}
.gut{width:46px;flex:none;background:var(--gutter);border-right:1px solid var(--line);overflow:hidden;color:var(--muted);font:13px/20px "JetBrains Mono",monospace;text-align:right;padding:8px 8px 8px 0;white-space:pre;user-select:none}
textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:var(--panel);color:var(--text);font:13px/20px "JetBrains Mono",monospace;padding:8px 12px;tab-size:2;white-space:pre;overflow:auto}
#div{flex:none;width:6px;background:var(--line);cursor:col-resize;touch-action:none}
.app.stack #div{width:auto;height:6px;cursor:row-resize}
#preview-container{flex:1;min-height:60px;display:flex;flex-direction:column}
.frame{flex:1;min-height:0;background:#fff}
iframe{border:0;width:100%;height:100%;background:#fff;display:block}
#runbar{display:flex;align-items:center;gap:6px;background:var(--bar);border-top:1px solid var(--line);padding:0 10px;height:40px;flex:none}
#con{flex:none;height:150px;display:flex;flex-direction:column;min-height:0}
#con.off{display:none}
#con-divider{width:100%;height:10px;background:var(--line);cursor:row-resize;touch-action:none;flex:none;position:relative}
#con-divider::after{content:"";position:absolute;left:50%;top:50%;width:36px;height:3px;margin:-1.5px 0 0 -18px;border-radius:2px;background:var(--muted);opacity:.6}
#con-divider:hover::after,#div:hover{opacity:1}
#log{flex:1;min-height:0;overflow:auto;font:12px/1.5 "JetBrains Mono",monospace;padding:6px 12px}
#log div{border-bottom:1px solid var(--line);padding:2px 0;white-space:pre-wrap;word-break:break-word}
.e{color:var(--err)}.w{color:var(--warn)}.i{color:var(--ok)}
.cbar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:var(--bar);border-bottom:1px solid var(--line);font:11px "JetBrains Mono",monospace;color:var(--muted);flex:none}
.cbar button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:999;max-width:90vw}
#toast.show{opacity:1}
input[type="file"]{display:none}
@media (max-width:760px){.app{flex-direction:column}#div{width:auto;height:6px;cursor:row-resize}.hide-m{display:none}header{flex-direction:column;align-items:flex-start}.hdr-right{width:100%}}
</style>
</head>
<body>
<header>
  <div class="hdr-left"><h1>Code Editor</h1><span id="savest">✓ Saved</span></div>
  <div class="hdr-right">
    <button class="btn primary" id="save" title="Save to this browser (Ctrl+S)">💾 Save</button>
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="btn" id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
    <button class="btn" id="imphtml" title="Select multiple HTML files">📄 HTML</button>
    <button class="btn" id="impcss" title="Select multiple CSS files">🎨 CSS</button>
    <button class="btn" id="impjs" title="Select multiple JS files">⚙️ JS</button>
    <button class="btn" id="impimg" title="Select multiple images">🖼️ Images</button>
    <button class="btn" id="theme">🌙 Theme</button>
  </div>
</header>
<main class="app" id="app">
  <section class="pane" id="ed">
    <div class="bar" id="tabs" role="tablist"></div>
    <div class="code"><div class="gut" id="gut">1</div><textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code"></textarea></div>
  </section>
  <div id="div" role="separator" tabindex="0"></div>
  <section class="pane" id="pv">
    <div id="preview-container">
      <div class="bar">
        <span class="live" id="live"><span>LIVE</span><b></b></span>
        <select id="page" aria-label="Preview page"></select>
        <span class="sp"></span>
        <button class="btn hide-m" id="lay">Stack</button>
        <button class="btn" id="dl" title="Download all files + images as website.zip">Download</button>
        <button class="btn" id="rst">Reset</button>
      </div>
      <div class="frame"><iframe id="out" title="Preview" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-top-navigation-by-user-activation"></iframe></div>
    </div>
    <div id="runbar">
      <button class="btn primary" id="run" title="Run again (Ctrl+Enter)">▶ Run</button>
      <button class="btn" id="cons">Console</button>
      <span class="sp"></span>
      <span style="font:11px 'JetBrains Mono',monospace;color:var(--muted)">auto-runs while you type</span>
    </div>
    <div id="con">
      <div id="con-divider" role="separator" aria-label="Drag to resize console" title="Drag to resize (double-click to reset)"></div>
      <div class="cbar"><span>Console &nbsp; <span id="conuse">0.0 / 25 KB</span></span><button id="clr">Clear</button></div>
      <div id="log"></div>
    </div>
  </section>
</main>
<div id="toast" role="status"></div>
<input type="file" id="fileinput" accept=".html,.htm" multiple>
<input type="file" id="fileinput2" accept=".css" multiple>
<input type="file" id="fileinput3" accept=".js" multiple>
<input type="file" id="fileinput4" accept="image/*" multiple>

<script>
(function(){
'use strict';

// ====== CONSTANTS ======
const SC = '<\/script>';
const KEY = 'code-editor:v4';
const CAP = 25 * 1024;               // console output limit (bytes of text)
const MAX_UNDO = 200;
const VOID_TAGS = /^(area|base|br|col|embed|hr|img|input|link|meta|source|track|wbr)$/i;
const PAIRS = {'(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`'};
const STOPPED = '<body style="font:14px sans-serif;padding:20px;color:#b33">Preview stopped: console output passed 25 KB (probably an infinite loop).<br>Fix the code, then press ▶ Run.</body>';

// ====== STATE ======
let files = starter();
let cur = 'index.html';
let page = 'index.html';
let images = {};
let undo = [];
let redo = [];
let editting = false;
let dirty = false;

// ====== DOM REFERENCES ======
function $(id) { return document.getElementById(id); }
const src = $('src');
const gut = $('gut');
const out = $('out');
const live = $('live');
const log = $('log');
const tabs = $('tabs');
const root = document.documentElement;

// ====== HELPERS ======
function starter() {
  return [
    {name:'index.html',content:'<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>Home</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <nav><a href="index.html">Home</a> <a href="about.html">About</a></nav>\n  <h1>Home page</h1>\n  <p>Test your code here. Create multiple pages and navigate between them.</p>\n  <button id="btn">Click me</button>\n  <p id="count">Clicks: 0</p>\n  <script src="script.js">'+SC+'\n</body>\n</html>'},
    {name:'about.html',content:'<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>About</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <nav><a href="index.html">Home</a> <a href="about.html">About</a></nav>\n  <h1>About page</h1>\n  <p>This page shares style.css with the home page.</p>\n</body>\n</html>'},
    {name:'style.css',content:'body {\n  font-family: system-ui, sans-serif;\n  max-width: 480px;\n  margin: 40px auto;\n  padding: 0 16px;\n}\nnav a {\n  margin-right: 12px;\n}\nbutton {\n  padding: 8px 16px;\n  font-size: 16px;\n  cursor: pointer;\n}'},
    {name:'script.js',content:'let n = 0;\nconst count = document.getElementById("count");\nconst btn = document.getElementById("btn");\n\nif (btn) {\n  btn.addEventListener("click", () => {\n    n++;\n    if (count) {\n      count.textContent = "Clicks: " + n;\n    }\n    console.log("Clicked", n, "times");\n  });\n}'}
  ];
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}

function get(name) {
  for (const f of files) if (f.name === name) return f;
  return null;
}

function ext(name) {
  const m = name.match(/\.([^.]+)$/);
  return m ? m[1].toLowerCase() : '';
}

const COL = {html: '#e2582b', css: '#2468d8', js: '#b9650f'};

function lines() {
  const n = src.value.split('\n').length;
  const a = [];
  for (let i = 1; i <= n; i++) a.push(i);
  gut.textContent = a.join('\n');
}

function htmls() { return files.filter(f => ext(f.name) === 'html'); }

function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// ====== SAVE (manual) ======
function setDirty(v) {
  dirty = v;
  $('save').classList.toggle('dirty', v);
  const s = $('savest');
  s.textContent = v ? '● Unsaved changes' : '✓ Saved';
  s.className = v ? 'unsaved' : '';
}
function markDirty() { if (!dirty) setDirty(true); }

function saveNow() {
  const f = get(cur);
  if (f) f.content = src.value;
  try {
    localStorage.setItem(KEY, JSON.stringify({files, cur, page, images}));
    setDirty(false);
    toast('✓ Saved');
  } catch (e) {
    toast('Save failed: browser storage is full or blocked (large images?)');
  }
}
$('save').onclick = saveNow;

window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

// ====== FILE MANAGEMENT ======
function renderTabs() {
  tabs.innerHTML = '';

  files.forEach(f => {
    const b = document.createElement('div');
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.tabIndex = 0;
    b.setAttribute('aria-selected', f.name === cur ? 'true' : 'false');

    const d = document.createElement('i');
    d.style.background = COL[ext(f.name)] || '#8b93a3';

    const l = document.createElement('span');
    l.textContent = f.name;

    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = 'Delete ' + f.name;

    b.append(d, l, x);

    b.onclick = () => open(f.name);
    b.onkeydown = (e) => { if (e.key === 'Enter' && e.target === b) open(f.name); };
    b.ondblclick = () => askName(f.name, b, (n) => rename(f.name, n));

    x.onclick = (e) => {
      e.stopPropagation();
      if (!x.classList.contains('sure')) {
        x.classList.add('sure');
        x.textContent = 'delete?';
        setTimeout(() => { x.classList.remove('sure'); x.textContent = '×'; }, 3000);
        return;
      }
      if (files.length < 2) { toast('Keep at least one file'); return; }

      files = files.filter(g => g !== f);
      if (cur === f.name) cur = files[0].name;
      fixPage();
      markDirty();
      open(cur);
      run();
    };

    tabs.appendChild(b);
  });

  const a = document.createElement('button');
  a.className = 'add';
  a.textContent = '+';
  a.title = 'New file';
  a.onclick = () => {
    askName('', a, (n) => {
      if (!ext(n)) n += '.html';
      if (get(n)) { toast(n + ' already exists'); return; }

      const tpl = ext(n) === 'html'
        ? '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>' + n.replace(/\.html$/, '') + '</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>' + n + '</h1>\n</body>\n</html>'
        : '';

      files.push({name: n, content: tpl});
      cur = n;
      fixPage();
      markDirty();
      open(cur);
      run();
    });
  };
  tabs.appendChild(a);

  const pg = $('page');
  pg.innerHTML = '';
  htmls().forEach(f => {
    const o = document.createElement('option');
    o.value = o.textContent = f.name;
    pg.appendChild(o);
  });
  pg.value = page;
}

function askName(init, el, cb) {
  const i = document.createElement('input');
  i.className = 'name';
  i.value = init;
  i.placeholder = 'page.html';
  el.replaceWith(i);
  i.focus();
  i.select();

  let done = false;
  const fin = (ok) => {
    if (done) return;
    done = true;
    const v = i.value.trim().replace(/[\\\/]/g, '');
    if (ok && v && v !== init) cb(v);
    else renderTabs();
  };

  i.onkeydown = (e) => {
    if (e.key === 'Enter') fin(true);
    if (e.key === 'Escape') fin(false);
  };
  i.onblur = () => fin(true);
}

function rename(a, b) {
  if (!ext(b)) b += '.' + ext(a);
  if (get(b)) { toast(b + ' already exists'); renderTabs(); return; }

  const f = get(a);
  if (f) {
    f.name = b;
    if (cur === a) cur = b;
    if (page === a) page = b;
    fixPage();
    markDirty();
    open(cur);
    run();
  }
}

function fixPage() {
  const h = htmls();
  if (!get(page) || ext(page) !== 'html') {
    page = (get('index.html') && 'index.html') || (h[0] && h[0].name) || '';
  }
}

function open(n) {
  cur = n;
  const f = get(n);
  if (f) {
    src.value = f.content;
    lines();
  }
  gut.scrollTop = 0;
  renderTabs();
  undo = [];
  redo = [];
  updateHistBtns();
}

function pushHist() {
  const f = get(cur);
  if (f) {
    undo.push(f.content);
    if (undo.length > MAX_UNDO) undo.shift();
    redo = [];
    updateHistBtns();
  }
}

function updateHistBtns() {
  $('undo').disabled = undo.length === 0;
  $('redo').disabled = redo.length === 0;
}

// ====== LOOP GUARD (stops infinite loops instead of freezing the tab) ======
// ==== GUARD START
function skipString(code, i) {
  const q = code[i], n = code.length;
  let j = i + 1;
  while (j < n) {
    const c = code[j];
    if (c === '\\') { j += 2; continue; }
    if (c === q || c === '\n') break;
    j++;
  }
  return Math.min(j + 1, n);
}
function skipTemplate(code, i) {
  const n = code.length;
  let j = i + 1;
  while (j < n) {
    const c = code[j];
    if (c === '\\') { j += 2; continue; }
    if (c === '`') return j + 1;
    if (c === '$' && code[j + 1] === '{') { j = skipBraces(code, j + 1); continue; }
    j++;
  }
  return n;
}
function skipBraces(code, i) {
  const n = code.length;
  let d = 0, j = i;
  while (j < n) {
    const c = code[j];
    if (c === '"' || c === "'") { j = skipString(code, j); continue; }
    if (c === '`') { j = skipTemplate(code, j); continue; }
    if (c === '/' && code[j + 1] === '/') { const k = code.indexOf('\n', j); j = k < 0 ? n : k; continue; }
    if (c === '/' && code[j + 1] === '*') { const k = code.indexOf('*/', j + 2); j = k < 0 ? n : k + 2; continue; }
    if (c === '{') d++;
    else if (c === '}') { d--; if (d === 0) return j + 1; }
    j++;
  }
  return n;
}
function matchParen(code, i) {
  const n = code.length;
  let d = 0, j = i;
  while (j < n) {
    const c = code[j];
    if (c === '"' || c === "'") { j = skipString(code, j); continue; }
    if (c === '`') { j = skipTemplate(code, j); continue; }
    if (c === '/' && code[j + 1] === '/') { const k = code.indexOf('\n', j); j = k < 0 ? n : k; continue; }
    if (c === '/' && code[j + 1] === '*') { const k = code.indexOf('*/', j + 2); j = k < 0 ? n : k + 2; continue; }
    if (c === '(') d++;
    else if (c === ')') { d--; if (d === 0) return j; }
    j++;
  }
  return -1;
}
// Inserts "__lp();" at the top of every for / while / do { ... } body.
function guardLoops(code) {
  const n = code.length;
  let out = '', i = 0, last = '';
  const isId = (c) => /[A-Za-z0-9_$]/.test(c);
  const ws = (j) => { while (j < n && /\s/.test(code[j])) j++; return j; };
  while (i < n) {
    const c = code[i], d = code[i + 1];
    if (c === '/' && d === '/') { const k = code.indexOf('\n', i); const e = k < 0 ? n : k; out += code.slice(i, e); i = e; continue; }
    if (c === '/' && d === '*') { const k = code.indexOf('*/', i + 2); const e = k < 0 ? n : k + 2; out += code.slice(i, e); i = e; continue; }
    if (c === '"' || c === "'") { const e = skipString(code, i); out += code.slice(i, e); i = e; last = c; continue; }
    if (c === '`') { const e = skipTemplate(code, i); out += code.slice(i, e); i = e; last = '`'; continue; }
    if (c === '/' && (last === '' || '(,=:[!&|?{};+-*%<>~^'.indexOf(last) > -1)) {
      let j = i + 1, cls = false;
      while (j < n) {
        const x = code[j];
        if (x === '\\') { j += 2; continue; }
        if (x === '\n') break;
        if (cls) { if (x === ']') cls = false; }
        else if (x === '[') cls = true;
        else if (x === '/') break;
        j++;
      }
      j = Math.min(j + 1, n);
      while (j < n && /[a-z]/i.test(code[j])) j++;
      out += code.slice(i, j); i = j; last = ')';
      continue;
    }
    if (isId(c)) {
      let j = i;
      while (j < n && isId(code[j])) j++;
      const w = code.slice(i, j);
      const before = last;
      out += w; i = j; last = 'a';
      if (before === '.') continue;
      if (w === 'for' || w === 'while') {
        const k = ws(i);
        if (code[k] === '(') {
          const close = matchParen(code, k);
          if (close > -1) {
            const b = ws(close + 1);
            if (code[b] === '{') {
              out += code.slice(i, b + 1) + ' __lp();';
              i = b + 1; last = '{';
            }
          }
        }
      } else if (w === 'do') {
        const b = ws(i);
        if (code[b] === '{') {
          out += code.slice(i, b + 1) + ' __lp();';
          i = b + 1; last = '{';
        }
      }
      continue;
    }
    out += c;
    if (!/\s/.test(c)) last = c;
    i++;
  }
  return out;
}
// ==== GUARD END

let canEval = null;
function evalOk() {
  if (canEval === null) {
    try { new Function(''); canEval = true; } catch (e) { canEval = false; }
  }
  return canEval;
}
function guarded(code) {
  if (!code) return code;
  let g;
  try { g = guardLoops(code); } catch (e) { return code; }
  if (g === code) return code;
  if (evalOk()) {
    // never ship instrumented code that does not compile
    try { new Function(code); } catch (e) { return code; }
    try { new Function(g); } catch (e) { return code; }
  }
  return g;
}

// ====== PREVIEW HOOK (runs inside the preview iframe) ======
// ==== HOOK START
function hookFn() {
  var LIMIT = 25600, MAXMSG = 2000, BUDGET = 3000;
  var sent = 0, told = false, ts = Date.now(), n = 0;
  var realOpen = window.open;

  function post(t, m) { try { parent.postMessage({__ce: 1, t: t, m: m}, '*'); } catch (e) {} }

  function emit(t, args) {
    if (sent >= LIMIT) {
      if (!told) { told = true; post('capped', ''); }
      return;
    }
    var m = Array.prototype.map.call(args, function (x) {
      if (typeof x === 'object' && x !== null) { try { return JSON.stringify(x); } catch (e) {} }
      return String(x);
    }).join(' ');
    if (m.length > MAXMSG) m = m.slice(0, MAXMSG) + ' ...(truncated)';
    sent += m.length + 1;
    post(t, m);
  }

  ['log', 'info', 'warn', 'error'].forEach(function (k) {
    var o = console[k];
    console[k] = function () {
      emit(k, arguments);
      try { o.apply(console, arguments); } catch (e) {}
    };
  });
  window.addEventListener('error', function (e) { emit('error', [e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '')]); });
  window.addEventListener('unhandledrejection', function (e) { emit('error', ['Unhandled: ' + e.reason]); });

  // loop guard: any loop that runs 3s without yielding is stopped
  function touch() { ts = Date.now(); }
  setInterval(touch, 50);
  ['click', 'keydown', 'input', 'pointerdown', 'touchstart', 'message'].forEach(function (k) {
    window.addEventListener(k, touch, true);
  });
  window.__lp = function () {
    if ((++n & 255) === 0 && Date.now() - ts > BUDGET) {
      throw new Error('Infinite loop stopped: a loop ran for more than 3 seconds without finishing.');
    }
  };

  // window.open("page.html") -> switch preview page
  window.open = function (u) {
    u = String(u == null ? '' : u);
    if (!u) return null;
    if (/^(https?:)?\/\//i.test(u)) { try { return realOpen.apply(window, arguments); } catch (x) { return null; } }
    post('nav', u);
    return {closed: false, close: function () {}, focus: function () {}};
  };

  // <a href="page.html"> -> switch preview page
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var h = a.getAttribute('href');
    if (/^(#|mailto:|tel:|javascript:)/i.test(h)) return;
    e.preventDefault();
    if (/^(https?:)?\/\//i.test(h)) { try { realOpen.call(window, h, '_blank'); } catch (x) {} return; }
    post('nav', h);
  }, true);

  // window.location.href = "page.html" (Navigation API, where supported)
  try {
    if (window.navigation && navigation.addEventListener) {
      navigation.addEventListener('navigate', function (e) {
        var u = (e.destination && e.destination.url) || '';
        if (e.hashChange || (e.destination && e.destination.sameDocument)) return;
        if (!/^(https?|file):/i.test(u) || !e.cancelable) return;   // ignores the editor's own srcdoc reloads
        e.preventDefault();
        post('nav', u.split('#')[0].split('?')[0].split('/').pop());
      });
    }
  } catch (x) {}
}
// ==== HOOK END

const HOOK = '<scr' + 'ipt>(' + hookFn.toString() + ')();' + SC;

// ====== PREVIEW & BUILD ======
function norm(h) {
  return String(h).split('#')[0].split('?')[0].replace(/^(\.?\/)+/, '');
}

function imgData(p) {
  const n = norm(p);
  if (images[n]) return images[n];
  const base = n.split('/').pop();
  return images[base] || null;
}

function inlineImagesInJs(code) {
  Object.keys(images).forEach((k) => {
    const re = new RegExp('(["\'])(?:\\.?\\/)?(?:[\\w.-]+\\/)*' + esc(k) + '\\1', 'g');
    code = code.replace(re, () => JSON.stringify(images[k]));
  });
  return code;
}

function build(name, hook) {
  const f = get(name);
  if (!f) return '<p style="font-family:sans-serif;padding:20px;color:#999">Add an HTML file to see preview.</p>';

  let h = f.content;

  if (!/<(html|body)/i.test(h)) {
    h = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + h + '</body></html>';
  }

  // CSS files
  h = h.replace(/<link\b[^>]*>/gi, (t) => {
    const m = t.match(/href=["']([^"']+)["']/i);
    if (m && /stylesheet/i.test(t)) {
      const r = get(norm(m[1]));
      if (r) return '<style>\n' + r.content.replace(/<\/style/gi, '<\\/style') + '\n</style>';
    }
    return t;
  });

  // Images: src="..." / poster="..." attributes and CSS url(...)
  h = h.replace(/(\s(?:src|poster|data-src)\s*=\s*)(["'])([^"']+)\2/gi, (m, a, q, p) => {
    const d = imgData(p);
    return d ? a + q + d + q : m;
  });
  h = h.replace(/url\(\s*(["']?)([^"')]+)\1\s*\)/gi, (m, q, p) => {
    if (/^(data:|https?:|\/\/|#)/i.test(p)) return m;
    const d = imgData(p);
    return d ? 'url(' + q + d + q + ')' : m;
  });

  // Scripts: inline project files, guard loops in all JS
  h = h.replace(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi, (t, attrs, body) => {
    const tm = attrs.match(/\btype\s*=\s*["']?([^"'\s>]+)/i);
    if (tm && !/javascript|module|ecmascript/i.test(tm[1])) return t;
    let code = body, a = attrs;
    const sm = attrs.match(/\bsrc\s*=\s*["']([^"']+)["']/i);
    if (sm) {
      const r = get(norm(sm[1]));
      if (!r) return t;                       // external script (CDN etc.)
      code = r.content;
      a = attrs.replace(/\bsrc\s*=\s*["'][^"']*["']/i, '');
    }
    code = inlineImagesInJs(guarded(code));
    return '<script' + a + '>\n' + code.replace(/<\/script/gi, '<\\/script') + '\n' + SC;
  });

  if (hook) {
    h = /<head[^>]*>/i.test(h)
      ? h.replace(/<head[^>]*>/i, (m) => m + HOOK)
      : HOOK + h;
  }

  return h;
}

// ====== CONSOLE (capped at 25 KB) ======
let used = 0, capped = false;

function setUse() { $('conuse').textContent = (used / 1024).toFixed(1) + ' / 25 KB'; }

function row(text, cls) {
  const r = document.createElement('div');
  if (cls) r.className = cls;
  r.textContent = text;
  log.appendChild(r);
  log.scrollTop = log.scrollHeight;
}

function capHit() {
  if (capped) return;
  capped = true;
  row('⚠ Console passed the 25 KB limit, so the preview was stopped (probably an infinite loop). Fix the code, then press ▶ Run.', 'e');
  live.classList.add('err');
  out.srcdoc = STOPPED;
  setUse();
}

function addLog(text, cls) {
  if (capped) return;
  if (used + text.length + 1 > CAP) { capHit(); return; }
  used += text.length + 1;
  row(text, cls);
  setUse();
}

function resetLog() {
  log.textContent = '';
  used = 0;
  capped = false;
  setUse();
}

function run() {
  live.classList.remove('err');
  resetLog();
  try {
    out.srcdoc = build(page, true);
  } catch (e) {
    live.classList.add('err');
    addLog('Build error: ' + e.message, 'e');
  }
}

let tm;
function sched() {
  clearTimeout(tm);
  tm = setTimeout(run, 350);
}

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.__ce || e.source !== out.contentWindow) return;

  if (d.t === 'capped') { capHit(); return; }

  if (d.t === 'nav') {
    let n = norm(d.m);
    if (!(get(n) && ext(n) === 'html')) n = n.split('/').pop();
    if (get(n) && ext(n) === 'html') {
      page = n;
      $('page').value = n;
      run();
    } else {
      toast('Page not found: ' + d.m);
      addLog('Navigation error: page "' + d.m + '" does not exist.', 'w');
    }
    return;
  }

  const text = String(d.m);
  if (d.t === 'error') { live.classList.add('err'); addLog(text, 'e'); }
  else if (d.t === 'warn') addLog(text, 'w');
  else addLog(text, 'i');
});

$('run').onclick = run;

src.addEventListener('input', () => {
  if (!editting) {
    pushHist();
    editting = true;
  }
  const f = get(cur);

    f.content = src.value;

});

src.addEventListener('keydown', (e) => {
  editting = false;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const a = src.selectionStart;
  const b = src.selectionEnd;
  const v = src.value;
  const k = e.key;
  const nx = v.charAt(b);
  const pv = v.charAt(a - 1);
  const isH = ext(cur) === 'html';

  if (k === 'Tab') {
    e.preventDefault();
    src.setRangeText('  ', a, b, 'end');
    src.dispatchEvent(new Event('input'));
    return;
  }

  if (k === 'Enter') {
    const ls = v.lastIndexOf('\n', a - 1) + 1;
    const ind = v.slice(ls, a).match(/^\s*/)[0];
    const before = v.slice(ls, a);
    e.preventDefault();

    if ((/[{(\[]/.test(pv) && /[})\]]/.test(nx)) ||
        (isH && pv === '>' && v.slice(b, b + 2) === '</')) {
      src.setRangeText('\n' + ind + '  \n' + ind, a, b, 'end');
      src.selectionStart = src.selectionEnd = a + 1 + ind.length + 2;
    } else {
      src.setRangeText('\n' + ind + (/[{(\[]\s*$/.test(before) ? '  ' : ''), a, b, 'end');
    }
    src.dispatchEvent(new Event('input'));
    return;
  }

  if (k === 'Backspace' && a === b) {
    if (PAIRS[pv] && PAIRS[pv] === nx) {
      e.preventDefault();
      src.setRangeText('', a - 1, a + 1, 'end');
      src.dispatchEvent(new Event('input'));
      return;
    }
  }

  if (a === b && k.length === 1 && ')]}"\'`'.indexOf(k) > -1 && nx === k) {
    e.preventDefault();
    src.selectionStart = src.selectionEnd = a + 1;
    return;
  }

  if (PAIRS[k]) {
    if (k === "'" && /\w/.test(pv)) return;

    if (a !== b) {
      e.preventDefault();
      const sel = v.slice(a, b);
      src.setRangeText(k + sel + PAIRS[k], a, b, 'select');
      src.selectionStart = a + 1;
      src.selectionEnd = b + 1;
      src.dispatchEvent(new Event('input'));
      return;
    }

    if (nx && !/[\s)\]}>,;]/.test(nx)) return;
    e.preventDefault();
    src.setRangeText(k + PAIRS[k], a, b, 'end');
    src.selectionStart = src.selectionEnd = a + 1;
    src.dispatchEvent(new Event('input'));
    return;
  }

  if (k === '>' && isH && a === b) {
    const lt = v.lastIndexOf('<', a - 1);
    const seg = v.slice(lt, a);
    const m = lt > -1 && seg.match(/^<([a-zA-Z][\w:-]*)(\s[^<>]*)?$/);

    if (m && !/\/$/.test(seg) && !VOID_TAGS.test(m[1])) {
      e.preventDefault();
      src.setRangeText('></' + m[1] + '>', a, b, 'end');
      src.selectionStart = src.selectionEnd = a + 1;
      src.dispatchEvent(new Event('input'));
    }
  }
});

document.addEventListener('keydown', (e) => {
  const m = e.ctrlKey || e.metaKey;
  if (!m) return;
  const key = e.key.toLowerCase();
  const inName = e.target && e.target.tagName === 'INPUT';
  if (key === 's') { e.preventDefault(); saveNow(); }
  else if (key === 'enter') { e.preventDefault(); run(); }
  else if (key === 'z' && !e.shiftKey && !inName) { e.preventDefault(); doUndo(); }
  else if ((key === 'y' || (key === 'z' && e.shiftKey)) && !inName) { e.preventDefault(); doRedo(); }
});

// ====== FILE IMPORT ======
function readFile(file, asDataUrl) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error || new Error('read failed'));
    if (asDataUrl) r.readAsDataURL(file); else r.readAsText(file);
  });
}

async function importFiles(list, type) {
  let added = 0, skipped = 0, lastName = null;
  for (const file of list) {
    try {
      if (type === 'img') {
        images[file.name] = await readFile(file, true);
        added++;
      } else {
        if (get(file.name)) { skipped++; continue; }
        files.push({name: file.name, content: await readFile(file, false)});
        lastName = file.name;
        added++;
      }
    } catch (e) {
      toast('Error loading ' + file.name);
    }
  }
  if (added) {
    markDirty();
    if (type !== 'img' && lastName) { cur = lastName; fixPage(); open(cur); run(); }
    else if (type === 'img') run();
  }
  toast((added ? '✓ Added ' + added + (type === 'img' ? ' image(s)' : ' file(s)') : 'Nothing added') +
        (skipped ? ' · ' + skipped + ' skipped (already exist)' : ''));
}

function bindImport(btnId, inputId, type) {
  const fi = $(inputId);
  fi.onchange = () => {
    const list = Array.from(fi.files || []);
    fi.value = '';
    if (list.length) importFiles(list, type);
  };
  $(btnId).onclick = () => fi.click();
}

// ==== ZIP START
const CRC_TABLE = (function () {
  const t = [];
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(b) {
  let c = ~0;
  for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8);
  return (~c) >>> 0;
}

function dataUrlBytes(u) {
  const i = u.indexOf(',');
  const meta = u.slice(5, i), body = u.slice(i + 1);
  if (/;base64/i.test(meta)) {
    const bin = atob(body);
    const a = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
    return a;
  }
  return new TextEncoder().encode(decodeURIComponent(body));
}

// list: [{name, data: Uint8Array}]
function zipBlob(list) {
  const enc = new TextEncoder();
  const parts = [], cd = [];
  let off = 0;
  const now = new Date();
  const dt = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dd = (((Math.max(now.getFullYear(), 1980) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  list.forEach((f) => {
    const nm = enc.encode(f.name);
    const d = f.data;
    const c = crc32(d);

    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true);
    h.setUint16(4, 20, true);
    h.setUint16(6, 0x0800, true);
    h.setUint16(10, dt, true);
    h.setUint16(12, dd, true);
    h.setUint32(14, c, true);
    h.setUint32(18, d.length, true);
    h.setUint32(22, d.length, true);
    h.setUint16(26, nm.length, true);
    parts.push(h.buffer, nm, d);

    const g = new DataView(new ArrayBuffer(46));
    g.setUint32(0, 0x02014b50, true);
    g.setUint16(4, 20, true);
    g.setUint16(6, 20, true);
    g.setUint16(8, 0x0800, true);
    g.setUint16(12, dt, true);
    g.setUint16(14, dd, true);
    g.setUint32(16, c, true);
    g.setUint32(20, d.length, true);
    g.setUint32(24, d.length, true);
    g.setUint16(28, nm.length, true);
    g.setUint32(42, off, true);
    cd.push(g.buffer, nm);

    off += 30 + nm.length + d.length;
  });

  let size = 0;
  cd.forEach((x) => { size += x.byteLength; });

  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, list.length, true);
  e.setUint16(10, list.length, true);
  e.setUint32(12, size, true);
  e.setUint32(16, off, true);

  return new Blob(parts.concat(cd, [e.buffer]), {type: 'application/zip'});
}
// ==== ZIP END

function projectEntries() {
  const enc = new TextEncoder();
  const list = files.map((f) => ({name: f.name, data: enc.encode(f.content)}));
  Object.keys(images).forEach((k) => {
    if (get(k)) return;                       // a text file already uses this name
    list.push({name: k, data: dataUrlBytes(images[k])});
  });
  return list;
}

async function saveBlob(blob, name) {
  // 1) published-page runtime
  if (window.claude && typeof window.claude.use === 'function') {
    let d = null;
    try { d = await window.claude.use('downloads'); } catch (e) {}
    if (d) {
      try {
        await d.save({filename: name, data: blob});
        toast('✓ Saved ' + name);
      } catch (e) {
        toast(e && e.code === 'declined' ? 'Download cancelled' : 'Download failed: ' + ((e && e.message) || e));
      }
      return;
    }
  }
  // 2) Android app (Capacitor): write to cache and open the share sheet
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Filesystem && cap.Plugins.Share) {
    try {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1]);
        r.onerror = () => rej(r.error);
        r.readAsDataURL(blob);
      });
      const w = await cap.Plugins.Filesystem.writeFile({path: name, data: b64, directory: 'CACHE'});
      await cap.Plugins.Share.share({title: name, url: w.uri});
      return;
    } catch (e) {
      toast('Share failed: ' + ((e && e.message) || e));
      return;
    }
  }
  // 3) normal browser / Electron
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast('✓ Download started');
}

async function download() {
  try {
    const f = get(cur);
    if (f) f.content = src.value;
    const entries = projectEntries();
    await saveBlob(zipBlob(entries), 'website.zip');
  } catch (e) {
    toast('Error: ' + e.message);
    live.classList.add('err');
    addLog('Download failed: ' + e.message, 'e');
  }
}

function endDrag() { drag = false; out.style.pointerEvents = ''; editting = false; }
dv.addEventListener('pointerup', endDrag);
dv.addEventListener('pointercancel', endDrag);

// ====== RESIZABLE CONSOLE (drag the bar above it) ======
const con = $('con');
const cdiv = $('con-divider');
let cdrag = false;
cdiv.addEventListener('pointerdown', (e) => {
  cdrag = true;
  cdiv.setPointerCapture(e.pointerId);
  out.style.pointerEvents = 'none';
  e.preventDefault();
});
cdiv.addEventListener('pointermove', (e) => {
  if (!cdrag) return;
  const r = $('pv').getBoundingClientRect();
  const maxH = Math.max(80, r.height - $('runbar').offsetHeight - 90);
  const h = Math.max(60, Math.min(maxH, r.bottom - e.clientY));
  con.style.height = h + 'px';
});
function endCdrag() { cdrag = false; out.style.pointerEvents = ''; }
cdiv.addEventListener('pointerup', endCdrag);
cdiv.addEventListener('pointercancel', endCdrag);
cdiv.addEventListener('dblclick', () => { con.style.height = ''; });

// ====== PAGE SELECT ======
$('page').onchange = function () {
  page = this.value;
  run();
};

// ====== LOAD FROM STORAGE ======
try {
  const s = localStorage.getItem(KEY);
  if (s) {
    const p = JSON.parse(s);
    if (p.files && p.files.length) {
      files = p.files;
      cur = p.cur;
      page = p.page;
      images = p.images || {};
    }
  }
  const t = localStorage.getItem('code-editor:v1:theme');
  if (t) root.setAttribute('data-theme', t);
} catch (e) {
  /* storage unavailable: start with the starter project */
}

// ====== INITIALIZE ======
if (!get(cur)) cur = files[0].name;
fixPage();
open(cur);
run();
updateHistBtns();
setUse();
setDirty(false);

})();
</script>
</body>
</html>
