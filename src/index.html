<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Editor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f6;--panel:#fff;--bar:#f0f1f4;--line:#dfe2e8;--text:#24272e;--muted:#7b8190;--gutter:#f7f8fa;--accent:#e2582b;--ok:#2f9e4f;--err:#d23a3a;--warn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1c1f25;--bar:#23272f;--line:#323843;--text:#e3e6ec;--muted:#8b93a3;--gutter:#20242b}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1c1f25;--bar:#23272f;--line:#323843;--text:#e3e6ec;--muted:#8b93a3;--gutter:#20242b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;flex-wrap:wrap;gap:8px}
h1{font-size:16px;font-weight:500;margin:0}
.hdr-left{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
.hdr-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.app{flex:1;min-height:0;margin:0 16px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;overflow:hidden}
.app.stack{flex-direction:column}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
#ed{flex:0 0 50%}
#pv{flex:1;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;background:var(--bar);border-bottom:1px solid var(--line);height:44px;padding:0 10px;flex:none;overflow-x:auto}
#tabs{padding:0;gap:0;overflow-x:auto;overflow-y:hidden}
.tab{border:0;background:none;color:var(--muted);font:500 12px "JetBrains Mono",monospace;padding:0 8px 0 14px;height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.tab i{width:9px;height:9px;border-radius:2px;display:block}
.tab[aria-selected="true"]{color:var(--text);background:var(--panel);border-bottom-color:var(--accent)}
.tab .x{border:0;background:none;color:var(--muted);font:14px/1 monospace;cursor:pointer;padding:4px;border-radius:4px;opacity:.6}
.tab .x:hover,.tab .x.sure{opacity:1;color:var(--err)}
.add{border:0;background:none;color:var(--muted);font:18px monospace;cursor:pointer;padding:0 12px;height:44px;flex:none}
.name{font:12px "JetBrains Mono",monospace;width:120px;padding:5px 7px;border:1px solid var(--accent);border-radius:5px;background:var(--panel);color:var(--text);outline:0;flex:none}
:focus-visible{outline:2px solid #3b82f6;outline-offset:-2px}
.sp{flex:1}
.btn,select{font:12px "JetBrains Mono",monospace;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover,select:hover{border-color:var(--muted)}
.btn.sure{border-color:var(--err);color:var(--err)}
.btn.dirty{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.live{font:11px "JetBrains Mono",monospace;color:var(--muted);display:flex;align-items:center;gap:7px;margin:0 4px}
.live b{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.err b{background:var(--err)}
.code{flex:1;min-height:0;display:flex}
.gut{width:46px;flex:none;background:var(--gutter);border-right:1px solid var(--line);overflow:hidden;color:var(--muted);font:13px/20px "JetBrains Mono",monospace;text-align:right;padding:8px 8px 8px 0;white-space:pre;user-select:none}
textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:var(--panel);color:var(--text);font:13px/20px "JetBrains Mono",monospace;padding:8px 12px;tab-size:2;white-space:pre;overflow:auto}
#div{flex:none;width:6px;background:var(--line);cursor:col-resize;touch-action:none}
.app.stack #div{width:auto;height:6px;cursor:row-resize}
#preview-container{flex:1;min-height:0;display:flex;flex-direction:column}
.frame{flex:1;min-height:0;background:#fff}
iframe{border:0;width:100%;height:100%;background:#fff;display:block}
#con{flex:none;height:130px;border-top:1px solid var(--line);display:flex;flex-direction:column}
#con.off{display:none}
#con-divider{width:100%;height:6px;background:var(--line);cursor:row-resize;touch-action:none;flex:none}
#log{flex:1;min-height:0;overflow:auto;font:12px/1.5 "JetBrains Mono",monospace;padding:6px 12px}
#log div{border-bottom:1px solid var(--line);padding:2px 0;white-space:pre-wrap;word-break:break-word}
.e{color:var(--err)}.w{color:var(--warn)}.i{color:var(--ok)}
.cbar{display:flex;justify-content:space-between;padding:4px 10px;background:var(--bar);font:11px "JetBrains Mono",monospace;color:var(--muted);flex:none}
.cbar button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:90%;text-align:center;background:var(--text);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:999}
#toast.show{opacity:1}
input[type="file"]{display:none}
@media (max-width:760px){
  .app{flex-direction:column}
  #div{width:auto;height:6px;cursor:row-resize}
  .hide-m{display:none}
  header{flex-direction:column;align-items:flex-start}
  .hdr-right{width:100%}
  textarea,.gut{font-size:16px;line-height:22px}
}
</style>
</head>
<body>
<header>
  <div class="hdr-left"><h1>Code Editor</h1></div>
  <div class="hdr-right">
    <button class="btn" id="saveb" title="Save (Ctrl+S)">💾 Save</button>
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="btn" id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
    <button class="btn" id="imphtml" title="Select multiple HTML files">📄 HTML</button>
    <button class="btn" id="impcss" title="Select multiple CSS files">🎨 CSS</button>
    <button class="btn" id="impjs" title="Select multiple JS files">⚙️ JS</button>
    <button class="btn" id="impimg" title="Select multiple images">🖼️ Images</button>
    <button class="btn" id="theme">🌙 Theme</button>
  </div>
</header>
<main class="app" id="app">
  <section class="pane" id="ed">
    <div class="bar" id="tabs" role="tablist"></div>
    <div class="code"><div class="gut" id="gut">1</div><textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code"></textarea></div>
  </section>
  <div id="div" role="separator" tabindex="0"></div>
  <section class="pane" id="pv">
    <div id="preview-container">
      <div class="bar">
        <span class="live" id="live"><span>PREVIEW</span><b></b></span>
        <select id="page" aria-label="Preview page"></select>
        <span class="sp"></span>
        <button class="btn" id="runb" title="Run JavaScript and show console output (Ctrl+Enter)">▶ Run</button>
        <button class="btn hide-m" id="lay">Stack</button>
        <button class="btn" id="cons">Console</button>
        <button class="btn" id="dl">Download</button>
        <button class="btn" id="rst">Reset</button>
      </div>
      <div class="frame"><iframe id="out" title="Preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe></div>
    </div>
    <div id="con">
      <div id="con-divider" role="separator"></div>
      <div class="cbar"><span>Console</span><button id="clr">Clear</button></div>
      <div id="log"></div>
    </div>
  </section>
</main>
<div id="toast" role="status"></div>
<input type="file" id="fileinput" accept=".html,.htm" multiple>
<input type="file" id="fileinput2" accept=".css" multiple>
<input type="file" id="fileinput3" accept=".js" multiple>
<input type="file" id="fileinput4" accept="image/*" multiple>

<script>
(function(){
'use strict';

// ====== CONSTANTS ======
const SC = '<\/script>';
const KEY = 'code-editor:v4';
const THEME_KEY = 'code-editor:v1:theme';
const VOID_TAGS = /^(area|base|br|col|embed|hr|img|input|link|meta|source|track|wbr)$/i;
const PAIRS = {'(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`'};
const COL = {html: '#e2582b', css: '#2468d8', js: '#b9650f'};

// ====== STATE ======
let files = starter();
let cur = 'index.html';
let page = 'index.html';
let images = {};
let undo = [];
let redo = [];
let grouping = false;
let groupTimer;

// ====== DOM ======
const $ = (id) => document.getElementById(id);
const src = $('src');
const gut = $('gut');
const out = $('out');
const live = $('live');
const log = $('log');
const tabs = $('tabs');
const root = document.documentElement;

// ====== HELPERS ======
function starter() {
  return [
    {name:'index.html',content:'<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>Home</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <nav><a href="index.html">Home</a> <a href="about.html">About</a></nav>\n  <h1>Home page</h1>\n  <p>Test your code here. Create multiple pages and navigate between them.</p>\n  <button id="btn">Click me</button>\n  <p id="count">Clicks: 0</p>\n  <script src="script.js">'+SC+'\n</body>\n</html>'},
    {name:'about.html',content:'<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>About</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <nav><a href="index.html">Home</a> <a href="about.html">About</a></nav>\n  <h1>About page</h1>\n  <p>This page shares style.css with the home page.</p>\n</body>\n</html>'},
    {name:'style.css',content:'body {\n  font-family: system-ui, sans-serif;\n  max-width: 480px;\n  margin: 40px auto;\n  padding: 0 16px;\n}\nnav a {\n  margin-right: 12px;\n}\nbutton {\n  padding: 8px 16px;\n  font-size: 16px;\n  cursor: pointer;\n}'},
    {name:'script.js',content:'let n = 0;\nconst count = document.getElementById("count");\nconst btn = document.getElementById("btn");\n\nif (btn) {\n  btn.addEventListener("click", () => {\n    n++;\n    if (count) {\n      count.textContent = "Clicks: " + n;\n    }\n    console.log("Clicked", n, "times");\n  });\n}'}
  ];
}

let dirty = false;
function updateSaveBtn() {
  const b = $('saveb');
  b.classList.toggle('dirty', dirty);
  b.textContent = dirty ? '💾 Save ●' : '💾 Save';
  document.title = (dirty ? '* ' : '') + 'Code Editor';
}
function markDirty() {
  if (!dirty) { dirty = true; updateSaveBtn(); }
}
// Saving only happens when you press Save (or Ctrl+S). Nothing is saved automatically.
function saveProject() {
  try {
    localStorage.setItem(KEY, JSON.stringify({files, cur, page, images}));
    dirty = false;
    updateSaveBtn();
    toast('✓ Saved');
  } catch (e) {
    toast('Could not save. Browser storage may be full.');
  }
}
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

function toast(msg, ms) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

function get(name) {
  for (const f of files) if (f.name === name) return f;
  return null;
}
function ext(name) {
  const m = name.match(/\.([^.]+)$/);
  return m ? m[1].toLowerCase() : '';
}
function htmls() { return files.filter(f => ext(f.name) === 'html'); }
function lines() {
  const n = src.value.split('\n').length;
  let s = '';
  for (let i = 1; i <= n; i++) s += (i > 1 ? '\n' : '') + i;
  gut.textContent = s;
}
function setLive(bad) { live.classList.toggle('err', !!bad); }
const LOG_CAP = 102400; // 100 KB of console output per run
let logBytes = 0;
function clearLog() { log.innerHTML = ''; logBytes = 0; }
function appendLog(cls, text) {
  const r = document.createElement('div');
  if (cls) r.className = cls;
  r.textContent = text;
  log.appendChild(r);
  while (log.childElementCount > 300) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}
function addLog(cls, text) {
  if (cls !== 'e') { // errors always show
    if (logBytes >= LOG_CAP) return;
    const room = LOG_CAP - logBytes;
    const over = text.length > room;
    if (over) text = text.slice(0, room);
    logBytes += text.length + 1;
    appendLog(cls, text);
    if (over || logBytes >= LOG_CAP) {
      logBytes = LOG_CAP;
      appendLog('w', '… output capped at 100 KB. Run again to reset.');
    }
    return;
  }
  appendLog(cls, text);
}
function placeholder(msg) {
  return '<!DOCTYPE html><meta charset="utf-8"><body style="font-family:system-ui,sans-serif;padding:20px;color:#666">' + msg + '</body>';
}

// ====== TABS & FILES ======
function renderTabs() {
  tabs.innerHTML = '';

  files.forEach(f => {
    const b = document.createElement('div');
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.tabIndex = 0;
    b.setAttribute('aria-selected', f.name === cur ? 'true' : 'false');

    const d = document.createElement('i');
    d.style.background = COL[ext(f.name)] || '#8b93a3';
    const l = document.createElement('span');
    l.textContent = f.name;
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = 'Delete ' + f.name;
    b.append(d, l, x);

    b.onclick = () => openFile(f.name);
    b.onkeydown = (e) => { if (e.key === 'Enter' && e.target === b) openFile(f.name); };
    b.ondblclick = () => askName(f.name, b, (n) => rename(f.name, n));

    x.onclick = (e) => {
      e.stopPropagation();
      if (!x.classList.contains('sure')) {
        x.classList.add('sure');
        x.textContent = 'delete?';
        setTimeout(() => { x.classList.remove('sure'); x.textContent = '×'; }, 3000);
        return;
      }
      if (files.length < 2) { toast('Keep at least one file'); return; }
      files = files.filter(g => g !== f);
      if (cur === f.name) cur = files[0].name;
      fixPage();
      markDirty();
      openFile(cur);
      preview();
    };

    tabs.appendChild(b);
  });

  const a = document.createElement('button');
  a.className = 'add';
  a.textContent = '+';
  a.title = 'New file';
  a.onclick = () => {
    askName('', a, (n) => {
      if (!ext(n)) n += '.html';
      if (get(n)) { toast(n + ' already exists'); return; }
      const tpl = ext(n) === 'html'
        ? '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>' + n.replace(/\.html$/, '') + '</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>' + n + '</h1>\n</body>\n</html>'
        : '';
      files.push({name: n, content: tpl});
      cur = n;
      fixPage();
      markDirty();
      openFile(cur);
      preview();
    });
  };
  tabs.appendChild(a);

  const pg = $('page');
  pg.innerHTML = '';
  htmls().forEach(f => {
    const o = document.createElement('option');
    o.value = o.textContent = f.name;
    pg.appendChild(o);
  });
  pg.value = page;
}

function askName(init, el, cb) {
  const i = document.createElement('input');
  i.className = 'name';
  i.value = init;
  i.placeholder = 'page.html';
  el.replaceWith(i);
  i.focus();
  i.select();

  let done = false;
  const fin = (ok) => {
    if (done) return;
    done = true;
    const v = i.value.trim().replace(/[\\\/]/g, '');
    if (ok && v && v !== init) cb(v);
    else renderTabs();
  };
  i.onkeydown = (e) => {
    if (e.key === 'Enter') fin(true);
    if (e.key === 'Escape') fin(false);
  };
  i.onblur = () => fin(true);
}

function rename(a, b) {
  if (!ext(b)) b += '.' + ext(a);
  if (get(b)) { toast(b + ' already exists'); renderTabs(); return; }
  const f = get(a);
  if (!f) return;
  f.name = b;
  if (cur === a) cur = b;
  if (page === a) page = b;
  fixPage();
  markDirty();
  openFile(cur);
  preview();
}

function fixPage() {
  if (!get(page) || ext(page) !== 'html') {
    const h = htmls();
    page = (get('index.html') && 'index.html') || (h[0] && h[0].name) || '';
  }
}

function openFile(n) {
  cur = n;
  const f = get(n);
  if (f) { src.value = f.content; lines(); }
  gut.scrollTop = 0;
  renderTabs();
  
  undo = [];
  redo = [];
  grouping = false;
  updateHistBtns();
}

function updateHistBtns() {
  $('undo').disabled = undo.length === 0;
  $('redo').disabled = redo.length === 0;
}

// ====== LOOP GUARD ======
// Rewrites `while(cond)` to `while(__lg()&&(cond))` and the middle part of
// `for(a;b;c)` the same way. __lg() (defined in HOOK) throws if the code has
// run for over 2 seconds without ever yielding to the browser.
function skipString(s, i) {
  const q = s[i];
  let j = i + 1;
  while (j < s.length && s[j] !== q) { if (s[j] === '\\') j++; j++; }
  return j + 1;
}
function matchParen(s, i) {
  let d = 0;
  for (let j = i; j < s.length; j++) {
    const c = s[j];
    if (c === '"' || c === "'" || c === '`') { j = skipString(s, j) - 1; continue; }
    if (c === '(') d++;
    else if (c === ')') { d--; if (d === 0) return j; }
  }
  return -1;
}
function splitTop(s) {
  const parts = [];
  let d = 0, st = 0;
  for (let j = 0; j < s.length; j++) {
    const c = s[j];
    if (c === '"' || c === "'" || c === '`') { j = skipString(s, j) - 1; continue; }
    if ('([{'.indexOf(c) > -1) d++;
    else if (')]}'.indexOf(c) > -1) d--;
    else if (c === ';' && d === 0) { parts.push(s.slice(st, j)); st = j + 1; }
  }
  parts.push(s.slice(st));
  return parts;
}
function guardLoops(js) {
  const n = js.length;
  const idRe = /[A-Za-z_$][\w$]*/y;
  let out = '', i = 0, prev = '';
  while (i < n) {
    const c = js[i], d = js[i + 1];
    if (c === '/' && d === '/') {
      let j = js.indexOf('\n', i); if (j < 0) j = n;
      out += js.slice(i, j); i = j; continue;
    }
    if (c === '/' && d === '*') {
      let j = js.indexOf('*/', i + 2); j = j < 0 ? n : j + 2;
      out += js.slice(i, j); i = j; continue;
    }
    if (c === '"' || c === "'" || c === '`') {
      const j = Math.min(skipString(js, i), n);
      out += js.slice(i, j); i = j; prev = c; continue;
    }
    if (c === '/' && (prev === '' || '(,=:[!&|?{};+-*%<>~^'.indexOf(prev) > -1)) {
      let j = i + 1, cls = false;
      while (j < n && js[j] !== '\n') {
        const e = js[j];
        if (e === '\\') j++;
        else if (e === '[') cls = true;
        else if (e === ']') cls = false;
        else if (e === '/' && !cls) break;
        j++;
      }
      j = Math.min(j + 1, n);
      out += js.slice(i, j); i = j; prev = ')'; continue;
    }
    if (/[A-Za-z_$]/.test(c)) {
      idRe.lastIndex = i;
      const word = idRe.exec(js)[0];
      if ((word === 'for' || word === 'while') && prev !== '.') {
        let k = i + word.length, j = k;
        while (j < n && /\s/.test(js[j])) j++;
        if (js[j] === '(') {
          const e = matchParen(js, j);
          if (e > 0) {
            const inner = js.slice(j + 1, e);
            let ni = inner;
            if (word === 'while') {
              ni = '__lg()&&(' + inner + ')';
            } else {
              const parts = splitTop(inner);
              if (parts.length === 3) {
                parts[1] = parts[1].trim() ? '__lg()&&(' + parts[1] + ')' : '__lg()';
                ni = parts.join(';');
              }
            }
            out += word + js.slice(k, j) + '(' + ni + ')';
            i = e + 1; prev = ')'; continue;
          }
        }
      }
      out += word; i += word.length; prev = word[word.length - 1]; continue;
    }
    out += c;
    if (!/\s/.test(c)) prev = c;
    i++;
  }
  return out;
}

// ====== PREVIEW HOOK (runs inside the preview iframe) ======
// This function is stringified and injected into the page. Keep it self-contained.
function hookFn() {
  var T = Date.now(), C = 0;
  var sent = 0, errs = 0;
  function send(t, a) {
    var m = Array.prototype.map.call(a, function (x) {
      if (x && typeof x === 'object') { try { return JSON.stringify(x); } catch (e) {} }
      return String(x);
    }).join(' ');
    if (t === 'error') { if (++errs > 50) return; }
    else if (t !== 'nav' && t !== 'ready') {
      if (sent >= 102400) return; // 100 KB output cap
      sent += m.length + 1;
    }
    try { parent.postMessage({__ce: 1, t: t, m: m}, '*'); } catch (e) {}
  }
  // Loop watchdog: T is refreshed whenever the browser gets a chance to run timers.
  window.__lg = function () {
    if ((++C & 63) === 0 && Date.now() - T > 2000) {
      throw new Error('Infinite loop stopped: code ran over 2 seconds without pausing');
    }
    return true;
  };
  setInterval(function () { T = Date.now(); }, 250);
  ['alert', 'confirm', 'prompt'].forEach(function (k) {
    var o = window[k];
    window[k] = function () { var r = o.apply(window, arguments); T = Date.now(); return r; };
  });
  var _open = window.open;
  window.open = function (u) {
    if (u && !/^(https?:)?\/\//i.test(u)) { send('nav', [u]); return null; }
    return _open.apply(window, arguments);
  };
  ['log', 'info', 'warn', 'error'].forEach(function (k) {
    var o = console[k];
    console[k] = function () { send(k, arguments); o.apply(console, arguments); };
  });
  window.addEventListener('error', function (e) { send('error', [e.message + ' (line ' + e.lineno + ')']); });
  window.addEventListener('unhandledrejection', function (e) { send('error', ['Unhandled: ' + e.reason]); });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var h = a.getAttribute('href');
    if (/^(#|mailto:|tel:|javascript:)/i.test(h)) return;
    e.preventDefault();
    if (/^(https?:)?\/\//i.test(h)) { _open.call(window, h, '_blank'); return; }
    send('nav', [h]);
  }, true);
  document.addEventListener('DOMContentLoaded', function () { T = Date.now(); send('ready', ['']); });
}
const HOOK = '<scr' + 'ipt>(' + hookFn.toString() + ')();' + SC;

// ====== BUILD ======
function norm(h) {
  return h.split('#')[0].split('?')[0].replace(/^(\.?\/)+/, '');
}
function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function build(name, hook, scripts) {
  const f = get(name);
  if (!f) return placeholder('Add an HTML file to see a preview.');

  let h = f.content;
  if (!/<(html|body)/i.test(h)) {
    h = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + h + '</body></html>';
  }

  // Inline CSS files
  h = h.replace(/<link\b[^>]*>/gi, (t) => {
    const m = t.match(/href=["']([^"']+)["']/i);
    if (m && /stylesheet/i.test(t)) {
      const r = get(norm(m[1]));
      if (r) return '<style>\n' + r.content.replace(/<\/style/gi, '<\\/style') + '\n</style>';
    }
    return t;
  });

  // Inline JS files
  h = h.replace(/<script\b([^>]*?)src=["']([^"']+)["']([^>]*)>\s*<\/script>/gi, (t, a, s, b) => {
    const r = get(norm(s));
    return r ? '<script' + a + b + '>\n' + r.content.replace(/<\/script/gi, '<\\/script') + '\n' + SC : t;
  });

  // Swap in uploaded images (src=, href=, poster=, url())
  Object.keys(images).forEach((k) => {
    const re = new RegExp('((?:src|href|poster)\\s*=\\s*["\']?|url\\(\\s*["\']?)\\/?(?:[\\w.\\-]+\\/)*' + esc(k) + '(?=["\'\\s)>])', 'gi');
    h = h.replace(re, (m, p) => p + images[k]);
  });

  if (hook) {
    // Visual-only mode: remove scripts so nothing executes until Run is pressed
    if (!scripts) h = h.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '');

    // Guard loops in all inline scripts
    h = h.replace(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi, (t, a, body) => {
      if (/\bsrc\s*=/i.test(a)) return t;
      const ty = (a.match(/\btype\s*=\s*["']?([^"'\s>]+)/i) || [])[1];
      if (ty && !/^(text\/javascript|application\/javascript|module)$/i.test(ty)) return t;
      try { return '<script' + a + '>' + guardLoops(body) + SC; } catch (e) { return t; }
    });

    // Inject the hook as early as possible
    if (/<head(\s[^>]*)?>/i.test(h)) h = h.replace(/<head(\s[^>]*)?>/i, (m) => m + HOOK);
    else if (/<html(\s[^>]*)?>/i.test(h)) h = h.replace(/<html(\s[^>]*)?>/i, (m) => m + HOOK);
    else h = HOOK + h;
  }
  return h;
}

let lastScripts = false;
let runTimer;
// render(false): HTML + CSS only, scripts are not executed (automatic).
// render(true):  also executes JavaScript and clears the console (Run button).
function render(scripts) {
  lastScripts = scripts;
  setLive(false);
  if (scripts) clearLog();
  try {
    out.srcdoc = build(page, true, scripts);
  } catch (e) {
    setLive(true);
    addLog('e', 'Build error: ' + e.message);
  }
}
function run() { render(true); }
function preview() { render(false); }
function sched() {
  clearTimeout(runTimer);
  runTimer = setTimeout(preview, 350);
}

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.__ce || e.source !== out.contentWindow) return;

  if (d.t === 'ready') return;
  if (d.t === 'nav') {
    const n = norm(d.m);
    if (get(n) && ext(n) === 'html') {
      page = n;
      $('page').value = n;
      
      render(lastScripts);
    } else {
      toast('Page not found: ' + d.m);
      addLog('w', 'Navigation error: page "' + d.m + '" does not exist.');
    }
    return;
  }
  if (d.t === 'error') { setLive(true); addLog('e', d.m); }
  else if (d.t === 'warn') addLog('w', d.m);
  else addLog('i', d.m);
});

// ====== TEXT EDITING ======
// Auto-close tags. Runs from the input event (not keydown) so it also works
// with mobile/IME keyboards that don't report a real key.
function inRawText(v, pos) {
  const before = v.slice(0, pos).toLowerCase();
  for (const t of ['script', 'style']) {
    if (before.lastIndexOf('<' + t) > before.lastIndexOf('</' + t)) return true;
  }
  return before.lastIndexOf('<!--') > before.lastIndexOf('-->');
}
function autoCloseTag() {
  const a = src.selectionStart, v = src.value;
  if (a !== src.selectionEnd || v[a - 1] !== '>') return;
  const lt = v.lastIndexOf('<', a - 2);
  if (lt < 0) return;
  const seg = v.slice(lt, a - 1);
  const m = seg.match(/^<([a-zA-Z][\w:.-]*)(\s[^<>]*)?$/);
  if (!m || /\/\s*$/.test(seg) || VOID_TAGS.test(m[1])) return;
  if (inRawText(v, lt)) return;
  const close = '</' + m[1] + '>';
  if (v.slice(a, a + close.length).toLowerCase() === close.toLowerCase()) return;
  src.setRangeText(close, a, a, 'start'); // cursor stays between the tags
}

src.addEventListener('input', (e) => {
  const f = get(cur);
  if (!f) return;
  if (e.inputType === 'insertText' && e.data === '>' && ext(cur) === 'html') autoCloseTag();
  if (!grouping) {
    undo.push(f.content);
    if (undo.length > 200) undo.shift();
    redo = [];
    grouping = true;
    updateHistBtns();
  }
  clearTimeout(groupTimer);
  groupTimer = setTimeout(() => { grouping = false; }, 700);
  f.content = src.value;
  lines();
  markDirty();
  sched();
});

src.addEventListener('scroll', () => { gut.scrollTop = src.scrollTop; });

src.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const a = src.selectionStart;
  const b = src.selectionEnd;
  const v = src.value;
  const k = e.key;
  const nx = v.charAt(b);
  const pv = v.charAt(a - 1);
  const isH = ext(cur) === 'html';
  const fire = () => src.dispatchEvent(new Event('input'));

  // Tab to indent (Shift+Tab leaves the editor)
  if (k === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    src.setRangeText('  ', a, b, 'end');
    fire();
    return;
  }

  // Smart Enter
  if (k === 'Enter') {
    const ls = v.lastIndexOf('\n', a - 1) + 1;
    const before = v.slice(ls, a);
    const ind = before.match(/^\s*/)[0];
    e.preventDefault();
    if ((/[{(\[]/.test(pv) && /[})\]]/.test(nx)) ||
        (isH && pv === '>' && v.slice(b, b + 2) === '</')) {
      src.setRangeText('\n' + ind + '  \n' + ind, a, b, 'end');
      src.selectionStart = src.selectionEnd = a + 1 + ind.length + 2;
    } else {
      src.setRangeText('\n' + ind + (/[{(\[]\s*$/.test(before) ? '  ' : ''), a, b, 'end');
    }
    fire();
    return;
  }

  // Backspace deletes an empty pair
  if (k === 'Backspace' && a === b && PAIRS[pv] && PAIRS[pv] === nx) {
    e.preventDefault();
    src.setRangeText('', a - 1, a + 1, 'end');
    fire();
    return;
  }

  // Type over a closing character
  if (a === b && k.length === 1 && ')]}"\'`'.indexOf(k) > -1 && nx === k) {
    e.preventDefault();
    src.selectionStart = src.selectionEnd = a + 1;
    return;
  }

  // Auto pair
  if (PAIRS[k]) {
    if (k === "'" && /\w/.test(pv)) return;
    if (a !== b) {
      e.preventDefault();
      const sel = v.slice(a, b);
      src.setRangeText(k + sel + PAIRS[k], a, b, 'select');
      src.selectionStart = a + 1;
      src.selectionEnd = b + 1;
      fire();
      return;
    }
    if (nx && !/[\s)\]}>,;]/.test(nx)) return;
    e.preventDefault();
    src.setRangeText(k + PAIRS[k], a, b, 'end');
    src.selectionStart = src.selectionEnd = a + 1;
    fire();
    return;
  }
});

document.addEventListener('keydown', (e) => {
  const m = e.ctrlKey || e.metaKey;
  if (!m) return;
  const key = e.key.toLowerCase();
  if (key === 's') { e.preventDefault(); saveProject(); }
  else if (key === 'enter') { e.preventDefault(); run(); }
  else if (e.target === src && key === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
  else if (e.target === src && (key === 'y' || (key === 'z' && e.shiftKey))) { e.preventDefault(); doRedo(); }
});

// ====== UNDO / REDO ======
function applyHistory(from, to) {
  const f = get(cur);
  if (!f || !from.length) return;
  to.push(f.content);
  f.content = from.pop();
  src.value = f.content;
  grouping = false;
  lines();
  markDirty();
  preview();
  updateHistBtns();
}
function doUndo() { applyHistory(undo, redo); }
function doRedo() { applyHistory(redo, undo); }
$('undo').onclick = doUndo;
$('redo').onclick = doRedo;

// ====== FILE IMPORT ======
function readDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}

function bindImport(btn, input, type) {
  btn.onclick = () => input.click();
  input.onchange = async () => {
    const list = Array.from(input.files);
    input.value = '';
    if (!list.length) return;

    let added = 0, last = null;
    for (const file of list) {
      try {
        if (type === 'img') {
          images[file.name] = await readDataURL(file);
          added++;
        } else {
          if (get(file.name)) { toast(file.name + ' skipped (already exists)'); continue; }
          files.push({name: file.name, content: await file.text()});
          last = file.name;
          added++;
        }
      } catch (e) {
        toast('Error loading ' + file.name);
      }
    }
    if (!added) return;
    if (last) cur = last;
    fixPage();
    markDirty();
    openFile(cur);
    preview();
    toast('✓ Added ' + added + (type === 'img' ? ' image(s)' : ' file(s)'));
  };
}
bindImport($('imphtml'), $('fileinput'), 'html');
bindImport($('impcss'), $('fileinput2'), 'css');
bindImport($('impjs'), $('fileinput3'), 'js');
bindImport($('impimg'), $('fileinput4'), 'img');

// ====== DOWNLOAD ======
const CRC_TABLE = (function () {
  const t = [];
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(b) {
  let c = ~0;
  for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8);
  return (~c) >>> 0;
}
function zip(list) { // list: [{name, data: Uint8Array}]
  const enc = new TextEncoder();
  const parts = [], cd = [];
  let off = 0;
  list.forEach((f) => {
    const nm = enc.encode(f.name);
    const d = f.data;
    const c = crc32(d);

    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true);
    h.setUint16(4, 20, true);
    h.setUint16(6, 0x0800, true);
    h.setUint16(12, 33, true); // 1980-01-01
    h.setUint32(14, c, true);
    h.setUint32(18, d.length, true);
    h.setUint32(22, d.length, true);
    h.setUint16(26, nm.length, true);
    parts.push(h.buffer, nm, d);

    const g = new DataView(new ArrayBuffer(46));
    g.setUint32(0, 0x02014b50, true);
    g.setUint16(4, 20, true);
    g.setUint16(6, 20, true);
    g.setUint16(8, 0x0800, true);
    g.setUint16(14, 33, true);
    g.setUint32(16, c, true);
    g.setUint32(20, d.length, true);
    g.setUint32(24, d.length, true);
    g.setUint16(28, nm.length, true);
    g.setUint32(42, off, true);
    cd.push(g.buffer, nm);

    off += 30 + nm.length + d.length;
  });

  let size = 0;
  cd.forEach((x) => { size += x.byteLength; });

  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, list.length, true);
  e.setUint16(10, list.length, true);
  e.setUint32(12, size, true);
  e.setUint32(16, off, true);

  return new Blob(parts.concat(cd, [e.buffer]), {type: 'application/zip'});
}
function dataUrlBytes(u) {
  const bin = atob(u.split(',')[1] || '');
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

function download() {
  try {
    const enc = new TextEncoder();
    const list = files.map(f => ({name: f.name, data: enc.encode(f.content)}));
    Object.keys(images).forEach(k => {
      if (!get(k)) list.push({name: k, data: dataUrlBytes(images[k])});
    });
    const url = URL.createObjectURL(zip(list));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'website.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('✓ Download started');
  } catch (e) {
    toast('Download failed: ' + e.message);
    setLive(true);
    addLog('e', 'Download failed: ' + e.message);
  }
}
$('dl').onclick = download;

// ====== RESET ======
const rb = $('rst');
rb.onclick = function () {
  if (!rb.classList.contains('sure')) {
    rb.classList.add('sure');
    rb.textContent = 'Sure?';
    setTimeout(() => { rb.classList.remove('sure'); rb.textContent = 'Reset'; }, 3000);
    return;
  }
  rb.classList.remove('sure');
  rb.textContent = 'Reset';
  files = starter();
  cur = page = 'index.html';
  images = {};
  markDirty();
  openFile(cur);
  preview();
  toast('✓ Reset. Press Save to keep it.');
};

// ====== UI CONTROLS ======
$('saveb').onclick = saveProject;
$('runb').onclick = run;
$('cons').onclick = () => $('con').classList.toggle('off');
$('clr').onclick = clearLog;
$('lay').onclick = () => {
  const s = $('app').classList.toggle('stack');
  $('lay').textContent = s ? 'Side by side' : 'Stack';
  $('ed').style.flex = '0 0 50%';
};
$('theme').onclick = () => {
  const dk = getComputedStyle(root).getPropertyValue('--bg').trim() === '#15171b';
  const n = dk ? 'light' : 'dark';
  root.setAttribute('data-theme', n);
  try { localStorage.setItem(THEME_KEY, n); } catch (e) {}
};
$('page').onchange = function () {
  page = this.value;
  preview();
};

// ====== RESIZABLE PANES ======
const dv = $('div');
let drag = false;
dv.addEventListener('pointerdown', (e) => {
  drag = true;
  dv.setPointerCapture(e.pointerId);
  out.style.pointerEvents = 'none';
});
dv.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const r = $('app').getBoundingClientRect();
  const v = getComputedStyle($('app')).flexDirection === 'column';
  const p = v ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
  $('ed').style.flex = '0 0 ' + Math.max(0.15, Math.min(0.85, p)) * 100 + '%';
});
const endDrag = () => { drag = false; out.style.pointerEvents = ''; };
dv.addEventListener('pointerup', endDrag);
dv.addEventListener('pointercancel', endDrag);

const cdiv = $('con-divider');
let cdrag = false;
cdiv.addEventListener('pointerdown', (e) => { cdrag = true; cdiv.setPointerCapture(e.pointerId); });
cdiv.addEventListener('pointermove', (e) => {
  if (!cdrag) return;
  const r = $('con').parentElement.getBoundingClientRect();
  const p = (r.bottom - e.clientY) / r.height;
  $('con').style.flex = '0 0 ' + Math.max(0.1, Math.min(0.8, p)) * 100 + '%';
});
cdiv.addEventListener('pointerup', () => { cdrag = false; });
cdiv.addEventListener('pointercancel', () => { cdrag = false; });

// ====== LOAD FROM STORAGE ======
try {
  const s = localStorage.getItem(KEY);
  if (s) {
    const p = JSON.parse(s);
    if (p && Array.isArray(p.files) && p.files.length &&
        p.files.every(f => f && typeof f.name === 'string' && typeof f.content === 'string')) {
      files = p.files;
      cur = p.cur;
      page = p.page;
      images = p.images && typeof p.images === 'object' ? p.images : {};
    }
  }
  const t = localStorage.getItem(THEME_KEY);
  if (t) root.setAttribute('data-theme', t);
} catch (e) {
  console.error('Storage load error:', e);
}

// ====== START ======
if (!get(cur)) cur = files[0].name;
fixPage();
openFile(cur);

// The page preview renders on its own. JavaScript only runs when you press Run.
preview();
})();
</script>
