name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Windows installer
        run: npm run build
      
      - name: Upload ONLY the .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: CodeEditor-Setup
          path: dist/CodeEditor-Setup-1.0.0.exe
          retention-days: 30name: Build Windows EXE

